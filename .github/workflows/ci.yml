name: CI

on: [push]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

# Read-only. This workflow restores, builds, tests and uploads an artifact; none of
# that writes to the repository. An explicit block also pins the scope against the
# repository-wide default, which is a setting that can change outside this file.
permissions:
  contents: read

# The build matrix is nine jobs across Linux, Windows and macOS runners, so a superseded
# run is an expensive thing to leave running. This workflow triggers on every push with
# no branch filter, which makes that easy to hit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              name: Linux,
              os: ubuntu-latest,
              filepath: "/home/runner/work/Slic3rPostProcessingUploader/Slic3rPostProcessingUploader/Slic3rPostProcessingUploader/bin/Release/net10.0/linux-x64/publish/",
            }
          - {
              name: Windows VS2022,
              os: windows-latest,
              filepath: "D:\\a\\Slic3rPostProcessingUploader\\Slic3rPostProcessingUploader\\Slic3rPostProcessingUploader\\bin\\Release\\net10.0\\win-x64\\publish\\",
            }
          - {
              name: MacOS,
              os: macos-latest,
              filepath: "/Users/runner/work/Slic3rPostProcessingUploader/Slic3rPostProcessingUploader/Slic3rPostProcessingUploader/bin/Release/net10.0/osx-arm64/publish/",
            }
        dotnet:
          - { name: .NET 10, version: "10.0.x", filepath: "net10.0" }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup .NET ${{ matrix.dotnet.version }} SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK Version
        run: dotnet new globaljson --sdk-version ${{ steps.setup-dotnet.outputs.dotnet-version }} --force
      - name: Verify SDK Installation
        run: dotnet --info
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --no-restore --verbosity normal
      - name: Publish
        run: dotnet publish --configuration Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.platform.name }}-${{ matrix.dotnet.name }}
          path: ${{ matrix.platform.filepath }}
